name: Caspian Proxy Auto Post

on:
  schedule:
    # ساعت ۰۸:۰۰ صبح به وقت ایران (04:30 UTC)
    - cron: '30 4 * * *'
    # ساعت ۱۲:۰۰ ظهر به وقت ایران (08:30 UTC)
    - cron: '30 8 * * *'
    # ساعت ۱۸:۳۰ عصر به وقت ایران (15:00 UTC)
    - cron: '0 15 * * *'
    # ساعت ۲۲:۳۰ شب به وقت ایران (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کدها
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: اجرای ربات پروکسی
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
