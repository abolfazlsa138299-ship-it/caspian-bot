name: Caspian Proxy Auto Post

on:
  schedule:
    # ارسال هر ۲ ساعت از ۸ صبح تا ۱۰ شب به وقت ایران
    - cron: '30 4,6,8,10,12,14,16,18 * * *'
    # ارسال آخرین پست شبانه در ساعت ۰۰:۳۰ بامداد به وقت ایران
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کدها
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: اجرای ربات پروکسی
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
